[tool.poetry]
name = "fira-backend"
version = "0.1.0"
description = "FIRA — FDMS Input Tax Recovery Platform Backend"
authors = ["Takudzwa Kunaka <takudzwa@example.com>"]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.28.0"}
pydantic = {extras = ["email"], version = "^2.6.4"}
pydantic-settings = "^2.2.1"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.28"}
alembic = "^1.13.1"
psycopg = {extras = ["binary"], version = "^3.1.18"}
redis = "^5.0.3"
rq = "^1.16.0"
pandas = "^2.2.1"
openpyxl = "^3.1.2"
xlrd = "^2.0.1"
chardet = "^5.2.0"
rapidfuzz = "^3.6.2"
xlsxwriter = "^3.2.0"
weasyprint = "^61.2"
python-docx = "^1.1.0"
docxtpl = "^0.16.8"
argon2-cffi = "^23.1.0"
pyjwt = {extras = ["cryptography"], version = "^2.8.0"}
python-multipart = "^0.0.9"
boto3 = "^1.34.69"
cryptography = "^42.0.5"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-cov = "^4.1.0"
hypothesis = "^6.99.4"
httpx = "^0.27.0"
black = "^24.3.0"
ruff = "^0.3.4"
mypy = "^1.9.0"
types-redis = "^4.6.0.20240311"
types-python-dateutil = "^2.9.0.20240316"
types-boto3 = "^1.34.69"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py312']

[tool.ruff]
line-length = 88
target-version = "py312"
select = ["E", "F", "W", "I", "N", "UP", "PL"]
ignore = ["PLR0913", "PLR0915"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["alembic/"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
