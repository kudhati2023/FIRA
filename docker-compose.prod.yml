# ==============================================================================
# FIRA Production Docker Compose Stack
# Enterprise Grade Deployment for Cloud SaaS & On-Premise Installations
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: fira_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fira_internal_network

  redis:
    image: redis:7-alpine
    container_name: fira_prod_redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fira_internal_network

  minio:
    image: minio/minio:RELEASE.2024-01-28T22-35-53Z
    container_name: fira_prod_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_prod_data:/data
    command: server /data --console-address ":9001"
    networks:
      - fira_internal_network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: fira_prod_api
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=${MINIO_BUCKET:-fira-documents}
      - JWT_SECRET=${JWT_SECRET}
      - MFA_ENCRYPTION_KEY=${MFA_ENCRYPTION_KEY}
      - SESSION_EXPIRE_MINUTES=${SESSION_EXPIRE_MINUTES:-60}
      - DEFAULT_RETENTION_MONTHS=${DEFAULT_RETENTION_MONTHS:-24}
      - APP_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - fira_internal_network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: fira_prod_worker
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=${MINIO_BUCKET:-fira-documents}
      - JWT_SECRET=${JWT_SECRET}
      - MFA_ENCRYPTION_KEY=${MFA_ENCRYPTION_KEY}
      - APP_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    command: python -m fira.workers.worker
    networks:
      - fira_internal_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: fira_prod_frontend
    restart: always
    depends_on:
      - api
    networks:
      - fira_internal_network

  nginx:
    image: nginx:1.27-alpine
    container_name: fira_prod_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certs_data:/etc/nginx/certs:ro
    depends_on:
      - api
      - frontend
    networks:
      - fira_internal_network

volumes:
  postgres_prod_data:
  redis_prod_data:
  minio_prod_data:
  certs_data:

networks:
  fira_internal_network:
    driver: bridge
